name: Jekyll asset path CI validate

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 #v7.0.1 

      - name: Set up Ruby
        uses: ruby/setup-ruby@95ef2b042f9d7a56d8268cba8559e2842e2ad01b #v1.321.0
        with:
          ruby-version: 3.2
          bundler-cache: true

      - name: Install dependencies
        run: bundle install

      - name: Build site
        run: bundle exec jekyll build --destination _site

      - name: Validate generated asset links
        run: |
          set -e
          bad=$(grep -R -En "href=\"/(assets|framework|assessment|resources|about|contact)|src=\"/assets|@import url\(\"/assets" _site || true)
          if [ -n "$bad" ]; then
            echo "Found root-relative asset/internal links in generated site:"
            echo "$bad"
            exit 1
          fi

      - name: Package storybook files
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a #v7.0.1 #provide nice artifact
        with:
          name: StaticSite
          path: _site
